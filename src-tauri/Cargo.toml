[package]
name = "frameforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FRAMEFORGE — Offline-first desktop media converter, inspector, and utility suite"

[lib]
name = "frameforge_lib"
crate-type = ["rlib"]
# tauri-build only passes Common-Controls v6 manifest linker args to binaries (`rustc-link-arg-bins`),
# so standalone `--lib` test harnesses on Windows fail with 0xc0000139 (TaskDialogIndirect).
# Core tests reside in `crates/frameforge-core`.
test = false
doctest = false

[[bin]]
name = "frameforge"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
frameforge-core = { path = "../crates/frameforge-core" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

